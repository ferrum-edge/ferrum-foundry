# Test-only group-to-role and group-to-namespace policy.
#
# The critical journeys need a second admin namespace to prove isolation. This
# file is mounted only by e2e/compose.e2e.yaml; the production starter policy
# deliberately grants every shipped role just the single demo namespace.

map $auth_groups $ferrum_role {
    default                          "";
    "~(^|,)ferrum-admins(,|$)"       "admin";
    "~(^|,)ferrum-operators(,|$)"    "operator";
    "~(^|,)ferrum-viewers(,|$)"      "viewer";
}

map $auth_groups $ferrum_namespaces {
    default                          "";
    "~(^|,)ferrum-admins(,|$)"       "ferrum-foundry-demo,ferrum-foundry-demo-b";
    "~(^|,)ferrum-operators(,|$)"    "ferrum-foundry-demo";
    "~(^|,)ferrum-viewers(,|$)"      "ferrum-foundry-demo";
}
