# ------------------------------------------------------------------
# Group-to-role and group-to-namespace policy.
# ------------------------------------------------------------------
#
# This file is included by BOTH the production configuration and the
# disposable demo configuration, at the `http` level. It is the authorization
# mapping itself, so the demo exercises the real policy rather than a
# look-alike. Only the identity *source* differs between the two.
#
# `$auth_groups` is set by `auth_request_set` from the identity provider's
# `X-Auth-Request-Groups` response header.
#
# The default is empty so an unmapped user is denied: Foundry rejects a
# request that carries a valid proof secret but no role. nginx takes the first
# matching pattern, so the highest privilege is listed first.

map $auth_groups $ferrum_role {
    default                          "";
    "~(^|,)ferrum-admins(,|$)"       "admin";
    "~(^|,)ferrum-operators(,|$)"    "operator";
    "~(^|,)ferrum-viewers(,|$)"      "viewer";
}

# Exact namespace names, comma separated. Foundry expands no wildcards or
# prefixes, and a `viewer` or `operator` with an empty list is rejected
# outright. Edit these to your own namespaces.
#
map $auth_groups $ferrum_namespaces {
    default                          "";
    "~(^|,)ferrum-admins(,|$)"       "ferrum-foundry-demo";
    "~(^|,)ferrum-operators(,|$)"    "ferrum-foundry-demo";
    "~(^|,)ferrum-viewers(,|$)"      "ferrum-foundry-demo";
}
