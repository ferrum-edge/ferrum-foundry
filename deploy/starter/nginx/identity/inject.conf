# ------------------------------------------------------------------
# The identity assertion Foundry trusts.
# ------------------------------------------------------------------
#
# Included by BOTH the production and demo configurations, inside the
# `location /` that proxies to the BFF. These four lines are the stripping
# guarantee as much as the injection: `proxy_set_header` REPLACES any
# client-supplied header of the same name, so a browser cannot smuggle
# `X-Ferrum-Role: admin` past them.
#
# Keep all four lines even when a value is empty. Any header not overwritten
# here is forwarded from the client as-is.
#
# Anyone who can reach the BFF port and knows the proof secret is a gateway
# administrator. The BFF publishes no host port in this stack; only the proxy
# does.

include /etc/nginx/secrets/ferrum-proxy-secret.conf;

proxy_set_header X-Ferrum-Auth-Secret $ferrum_proxy_secret;
proxy_set_header X-Forwarded-User     $auth_user;
proxy_set_header X-Ferrum-Role        $ferrum_role;
proxy_set_header X-Ferrum-Namespaces  $ferrum_namespaces;
