# ------------------------------------------------------------------
# Ferrum Foundry — production reverse proxy
# ------------------------------------------------------------------
#
# Terminates TLS, delegates login to oauth2-proxy, maps the identity
# provider's groups to a Ferrum role and namespace list, and injects the four
# identity headers Foundry trusts.
#
# Deployment-specific values to replace before use:
#   server_name, ssl_certificate, ssl_certificate_key
#   the namespace lists in nginx/identity/policy.conf
#
# The proof secret is NOT in this file. It lives in
# ./secrets/ferrum-proxy-secret.conf, one line:
#     set $ferrum_proxy_secret "<FERRUM_TRUSTED_PROXY_SECRET>";
# deployed with restrictive permissions or rendered from a secret manager.

include /etc/nginx/identity/policy.conf;

# Defense in depth for Foundry's own admission pools: at most 64 API requests
# in flight per client address (each HTTP/2 stream counts). nginx applies this
# before auth_request runs, so it cannot key on the identity; Foundry bounds
# each identity itself (FERRUM_MAX_LONG_READS_PER_PRINCIPAL). Page and asset
# loads are not counted. Raise the limit if many users share one address.
# The key is the decoded, normalized $uri: the raw $request_uri would miss a
# percent-encoded prefix such as /%61pi/, which still reaches the API.
map $uri $foundry_api_client {
    default            "";
    ~^/api/            $binary_remote_addr;
}

limit_conn_zone $foundry_api_client zone=foundry_api:10m;

# A diagnostic lookup's path is a reference that a mistaken client could fill
# with a credential, so its request line is never logged: the access log
# records a fixed placeholder for it, selected on the normalized $uri so an
# escaped prefix such as /%61pi/diagnostics/ is covered too.
map $uri $foundry_logged_request {
    default                  $request;
    ~^/api/diagnostics/      "$request_method /api/diagnostics/[redacted] $server_protocol";
}

log_format foundry_redacted '$remote_addr - $remote_user [$time_local] "$foundry_logged_request" '
                            '$status $body_bytes_sent "$http_referer" "$http_user_agent"';


server {
    listen 443 ssl;
    http2 on;
    server_name foundry.example.com;

    access_log /var/log/nginx/access.log foundry_redacted;

    ssl_certificate     /etc/nginx/tls/foundry.crt;
    ssl_certificate_key /etc/nginx/tls/foundry.key;

    # Restore uploads are streamed and can reach 110 MB; API-spec imports 30 MB.
    client_max_body_size 110m;

    # oauth2-proxy runs with --reverse-proxy, so it believes the
    # X-Forwarded-* headers it receives. This server is the edge: it sets
    # every one of them from its own view of the request and never passes a
    # client's value through. A forged X-Forwarded-For or X-Forwarded-Uri is
    # what the header-spoofing bypasses of oauth2-proxy's --trusted-ip and
    # --skip-auth-route options rely on, should a deployment add either.
    # X-Request-Id is nginx's own $request_id too: oauth2-proxy logs it as the
    # request ID, so a client's value would forge log correlation.
    location /oauth2/ {
        proxy_pass       http://oauth2-proxy:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        proxy_set_header X-Request-Id      $request_id;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        # Never pass the BFF's proof secret or identity headers to
        # oauth2-proxy (for example, the starter preflight's forged-identity
        # probe sends the real proof secret to the front door). An empty value
        # means nginx sends no header at all.
        proxy_set_header X-Ferrum-Auth-Secret "";
        proxy_set_header X-Forwarded-User     "";
        proxy_set_header X-Ferrum-Role        "";
        proxy_set_header X-Ferrum-Namespaces  "";
    }

    location = /oauth2/auth {
        internal;
        proxy_pass       http://oauth2-proxy:4180;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        proxy_set_header X-Request-Id      $request_id;
        # Only the sign-in routes under /oauth2/ read this; the subrequest
        # would otherwise inherit the client's value. An empty value means
        # nginx sends no header at all.
        proxy_set_header X-Auth-Request-Redirect "";
        # Never pass the BFF's proof secret or identity headers to
        # oauth2-proxy; the auth_request subrequest would otherwise inherit
        # what the client sent, including the preflight's forged-identity
        # probe carrying the real proof secret.
        proxy_set_header X-Ferrum-Auth-Secret "";
        proxy_set_header X-Forwarded-User     "";
        proxy_set_header X-Ferrum-Role        "";
        proxy_set_header X-Ferrum-Namespaces  "";
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = @signin;

        auth_request_set $auth_user   $upstream_http_x_auth_request_user;
        auth_request_set $auth_groups $upstream_http_x_auth_request_groups;

        include /etc/nginx/identity/inject.conf;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-Id      $request_id;
        # The BFF trusts X-Forwarded-* from this hop, so nothing a client sent
        # under these names may reach it, nor under the names oauth2-proxy
        # uses for an identity. An empty value sends no header.
        proxy_set_header X-Forwarded-Uri   "";
        proxy_set_header X-Auth-Request-Redirect "";
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header X-Auth-Request-Groups "";

        # Stream large restores instead of buffering them to disk.
        proxy_request_buffering off;
        proxy_read_timeout 180s;

        limit_conn        foundry_api 64;
        limit_conn_status 429;

        proxy_pass http://foundry:8080;
    }

    # A browser loading a page goes through the login flow. An XHR from the SPA
    # keeps the raw 401 so the app can offer "Continue with SSO" itself and
    # never receives a sign-in page where it expects JSON.
    location @signin {
        # The normalized $uri, so an escaped API prefix (/%61pi/) is refused
        # here too instead of being echoed into a sign-in redirect.
        if ($uri ~ ^/api/) {
            return 401;
        }
        return 302 /oauth2/start?rd=$request_uri;
    }
}
