# ------------------------------------------------------------------
# Ferrum Foundry — production reverse proxy
# ------------------------------------------------------------------
#
# Terminates TLS, delegates login to oauth2-proxy, maps the identity
# provider's groups to a Ferrum role and namespace list, and injects the four
# identity headers Foundry trusts.
#
# Deployment-specific values to replace before use:
#   server_name, ssl_certificate, ssl_certificate_key
#   the namespace lists in nginx/identity/policy.conf
#
# The proof secret is NOT in this file. It lives in
# ./secrets/ferrum-proxy-secret.conf, one line:
#     set $ferrum_proxy_secret "<FERRUM_TRUSTED_PROXY_SECRET>";
# deployed with restrictive permissions or rendered from a secret manager.

include /etc/nginx/identity/policy.conf;

server {
    listen 443 ssl;
    http2 on;
    server_name foundry.example.com;

    ssl_certificate     /etc/nginx/tls/foundry.crt;
    ssl_certificate_key /etc/nginx/tls/foundry.key;

    # Restore uploads are streamed and can reach 110 MB; API-spec imports 30 MB.
    client_max_body_size 110m;

    location /oauth2/ {
        proxy_pass       http://oauth2-proxy:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass       http://oauth2-proxy:4180;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = @signin;

        auth_request_set $auth_user   $upstream_http_x_auth_request_user;
        auth_request_set $auth_groups $upstream_http_x_auth_request_groups;

        include /etc/nginx/identity/inject.conf;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream large restores instead of buffering them to disk.
        proxy_request_buffering off;
        proxy_read_timeout 180s;

        proxy_pass http://foundry:8080;
    }

    # A browser loading a page goes through the login flow. An XHR from the SPA
    # keeps the raw 401 so the app can offer "Continue with SSO" itself and
    # never receives a sign-in page where it expects JSON.
    location @signin {
        if ($request_uri ~ ^/api/) {
            return 401;
        }
        return 302 /oauth2/start?rd=$request_uri;
    }
}
