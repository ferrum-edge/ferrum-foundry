# ==================================================================
#  DISPOSABLE DEMO CONFIGURATION — NOT FOR PRODUCTION
# ==================================================================
#
# This file replaces the identity *provider* with a local stub so the stack
# runs, and can be tested in CI, without an external IdP. Everything below the
# identity source is the production path, byte for byte: the group-to-role
# policy and the four identity headers come from the same two includes the
# production configuration uses, so the demo cannot drift from it.
#
# What is stubbed: the OIDC login flow. A request names its identity with an
# `X-Demo-Identity` header, and the stub answers the same `auth_request`
# contract oauth2-proxy implements (`X-Auth-Request-User` /
# `X-Auth-Request-Groups`, or 401).
#
# What is NOT stubbed: group-to-role mapping, namespace grants, header
# stripping, the proof secret, Foundry's trusted-proxy validation, or the
# gateway. An unmapped identity is denied here exactly as it is in production.
#
# This listens on plain HTTP and must only ever be published to loopback.

include /etc/nginx/identity/policy.conf;

# The stub identity provider's directory. Add entries to grant demo logins.
map $http_x_demo_identity $demo_user {
    default            "";
    "admin"            "demo-admin@example.com";
    "operator"         "demo-operator@example.com";
    "viewer"           "demo-viewer@example.com";
    "unmapped"         "demo-contractor@example.com";
}

map $http_x_demo_identity $demo_groups {
    default            "";
    "admin"            "ferrum-admins";
    "operator"         "ferrum-operators";
    "viewer"           "ferrum-viewers";
    # Authenticated at the IdP, in no Ferrum group: the production `map`
    # default leaves the role empty and Foundry refuses the request.
    "unmapped"         "contractors";
}

# The stub. Loopback-only inside the container; nothing outside can reach it.
server {
    listen 127.0.0.1:4181;

    location = /auth {
        add_header X-Auth-Request-User   $demo_user   always;
        add_header X-Auth-Request-Groups $demo_groups always;

        # An unrecognised demo identity is "not signed in": the same 401 an
        # OIDC proxy returns, which nginx turns into the sign-in redirect.
        if ($demo_user = "") {
            return 401;
        }
        return 204;
    }
}

server {
    listen 8080;
    server_name localhost;

    client_max_body_size 110m;

    # The stack is published on a different host port than this listener, so
    # nginx must not rewrite the sign-in redirect into an absolute URL naming
    # 8080 — a browser following it lands on a port nothing is listening on.
    absolute_redirect off;

    # Production sends an unauthenticated browser to the identity provider.
    # The stub has no login page, so it says how to name an identity instead
    # of redirecting into a loop the demo cannot complete.
    location = /oauth2/start {
        default_type text/plain;
        return 200 "Demo stack: name an identity with the X-Demo-Identity request header (admin, operator, viewer, unmapped).\nProduction replaces this endpoint with your identity provider's login flow.\n";
    }

    location = /oauth2/auth {
        internal;
        proxy_pass       http://127.0.0.1:4181/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Demo-Identity $http_x_demo_identity;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = @signin;

        auth_request_set $auth_user   $upstream_http_x_auth_request_user;
        auth_request_set $auth_groups $upstream_http_x_auth_request_groups;

        include /etc/nginx/identity/inject.conf;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_read_timeout 180s;

        proxy_pass http://foundry:8080;
    }

    location @signin {
        if ($request_uri ~ ^/api/) {
            return 401;
        }
        return 302 /oauth2/start?rd=$request_uri;
    }
}
