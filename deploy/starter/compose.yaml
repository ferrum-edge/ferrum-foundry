# ------------------------------------------------------------------
# Ferrum Foundry starter stack
# ------------------------------------------------------------------
#
#   browser -> proxy (the only published port) -> Foundry BFF -> Ferrum Edge
#
# Two profiles:
#
#   production  the documented topology: nginx terminating TLS, oauth2-proxy
#               owning the OIDC login, your own Ferrum Edge gateway.
#
#   demo        a disposable stack for a first run and for CI. It adds a
#               throwaway gateway and backend and swaps the identity provider
#               for a local stub. The authorization policy, the identity
#               headers, and Foundry itself are the production path.
#
# Compose interpolates the whole file before it filters by profile, so only
# variables BOTH profiles need are marked required (`:?`). A production-only or
# demo-only value that failed to interpolate would stop the other profile from
# starting at all; those are left to the service that reads them, which fails
# with its own message naming what is missing.
#
# Copy .env.example to .env, fill it in, then:
#
#   ./bootstrap-demo.sh            # demo only: generate throwaway secrets
#   docker compose --profile demo up -d
#   (cd ../.. && npm ci)           # once per checkout: the preflight's dependencies
#   node ../../scripts/starter-preflight.mjs --env .env   # README.md: host-side URL overrides
#
# See README.md, and docs/getting-started.md for the first-route walkthrough.

services:
  foundry:
    # Published v0.5.6 digest. Set FOUNDRY_IMAGE to another released pairing
    # for production; CI overrides this with the image under test.
    image: ${FOUNDRY_IMAGE:-ferrumedge/ferrum-foundry@sha256:1dbe6878b6833bb56805c6de5f5162f1f4970b7a50d71d8921ea2f6bdd46010e}
    restart: unless-stopped
    # The BFF drains for up to FERRUM_SHUTDOWN_TIMEOUT (10s below) and then
    # logs and exits nonzero; orchestration grace must exceed that deadline
    # (Compose otherwise defaults to 10s and can force-kill first).
    stop_grace_period: 20s
    profiles: [production, demo]
    # Deliberately no host port: the BFF is reachable only through the proxy.
    expose:
      - "8080"
    environment:
      NODE_ENV: production
      FERRUM_ADMIN_URL: ${FERRUM_ADMIN_URL:?set FERRUM_ADMIN_URL in .env}
      # Production refuses a plaintext admin URL to any host but loopback, since
      # every request carries a signed admin token. Only bootstrap-demo.sh sets
      # this, for the disposable gateway on the compose network.
      FERRUM_ALLOW_INSECURE_ADMIN_HTTP: ${FERRUM_ALLOW_INSECURE_ADMIN_HTTP:-false}
      FERRUM_JWT_SECRET: ${FERRUM_JWT_SECRET:?set FERRUM_JWT_SECRET in .env}
      FERRUM_JWT_AUDIENCE: ${FERRUM_JWT_AUDIENCE:-ferrum-admin}
      FERRUM_AUTH_MODE: trusted-proxy
      FERRUM_TRUSTED_PROXY_SECRET: ${FERRUM_TRUSTED_PROXY_SECRET:?set FERRUM_TRUSTED_PROXY_SECRET in .env}
      FERRUM_AUTH_LOGIN_URL: ${FERRUM_AUTH_LOGIN_URL:-/oauth2/start}
      FERRUM_AUTH_LOGOUT_URL: ${FERRUM_AUTH_LOGOUT_URL:-/oauth2/sign_out}
      FERRUM_ENABLE_HSTS: ${FERRUM_ENABLE_HSTS:-true}
      # Secure, __Host- cookies. Only the HTTP-only demo bootstrap turns this
      # off: browsers that do not treat plain-HTTP loopback as secure (Safari,
      # WebKit) would otherwise drop the session and CSRF cookies.
      FERRUM_SECURE_COOKIES: ${FERRUM_SECURE_COOKIES:-true}
      # Failed proxy-proof throttle (docs/authentication.md, "Failed-authentication
      # lockout"). 0 failures disables it.
      FERRUM_AUTH_MAX_FAILURES: ${FERRUM_AUTH_MAX_FAILURES:-10}
      FERRUM_AUTH_LOCKOUT_SECONDS: ${FERRUM_AUTH_LOCKOUT_SECONDS:-60}
      FERRUM_SHUTDOWN_TIMEOUT: "10000"
      # Extra trust anchors for the admin API connection, when the gateway
      # presents a private certificate. Leave unset for a public chain.
      FERRUM_TLS_CA_ROOT: ${FERRUM_TLS_CA_ROOT:-}
      FERRUM_TLS_CA_PATH: ${FERRUM_TLS_CA_PATH:-}
    volumes:
      - ./ca:/etc/ferrum/ca:ro
    # Deliberately no `env_file`: the OAuth client secret never enters the
    # BFF's environment.

  oauth2-proxy:
    # Third-party images name their tag and digest together: the digest is what
    # runs, and the tag lets Dependabot (.github/dependabot.yml) propose the next
    # release. A tag in a comment is invisible to it.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
    restart: unless-stopped
    profiles: [production]
    expose:
      - "4180"
    # Its own file, not `.env`: `.env` holds FERRUM_JWT_SECRET, which signs
    # gateway admin tokens, and the proxy proof secret. oauth2-proxy needs
    # neither, and an env_file hands a service every variable in it.
    #
    # The issuer, redirect URL, and email domain come from here as
    # OAUTH2_PROXY_* variables rather than through compose interpolation, so a
    # demo run does not have to supply production identity settings. Missing
    # ones are reported by oauth2-proxy itself at startup. `required: false`
    # keeps the demo profile, which never runs this service, from needing the
    # file to exist. PKCE (OAUTH2_PROXY_CODE_CHALLENGE_METHOD=S256) is set
    # there too, because whether it can be used depends on the provider.
    env_file:
      - path: oauth2-proxy.env
        required: false
    command:
      - --provider=oidc
      - --scope=openid email profile groups
      - --oidc-groups-claim=groups
      # Denies a user who is in none of the Ferrum groups at login, before
      # nginx ever reaches the group-to-role mapping.
      - --allowed-group=ferrum-admins
      - --allowed-group=ferrum-operators
      - --allowed-group=ferrum-viewers
      - --set-xauthrequest=true
      # Trusts the X-Forwarded-* headers nginx sets (nginx/foundry.conf
      # overwrites every one of them), but only from a peer on this stack's
      # own network (`networks.default` below): a request from any other
      # address is judged by its own Host, path and peer address, whatever
      # X-Forwarded-* or X-Real-IP it carries. The range also holds the
      # Docker host (the bridge gateway) and every container on this network,
      # so keep it to the services here. This service still publishes no
      # port. Both values come from FOUNDRY_STARTER_SUBNET, so they cannot
      # drift apart.
      - --reverse-proxy=true
      - --trusted-proxy-ip=${FOUNDRY_STARTER_SUBNET:-10.73.88.0/24}
      - --http-address=0.0.0.0:4180

  proxy:
    image: nginx:1.31.9-alpine@sha256:fb4658584bd9a916ffb6f6e365f97c25cfdb2923801f551ea08356e695f14ff7
    restart: unless-stopped
    profiles: [production]
    depends_on:
      - foundry
      - oauth2-proxy
    ports:
      - "443:443"
    volumes:
      - ./nginx/foundry.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/identity:/etc/nginx/identity:ro
      - ./secrets:/etc/nginx/secrets:ro
      - ./tls:/etc/nginx/tls:ro

  # ---------------- demo profile ----------------

  demo-proxy:
    image: nginx:1.31.9-alpine@sha256:fb4658584bd9a916ffb6f6e365f97c25cfdb2923801f551ea08356e695f14ff7
    restart: unless-stopped
    profiles: [demo]
    depends_on:
      - foundry
    # Loopback only. The demo identity stub trusts a request header.
    ports:
      - "127.0.0.1:${FOUNDRY_DEMO_PORT:-8088}:8080"
    volumes:
      - ./nginx/foundry.demo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/identity:/etc/nginx/identity:ro
      - ./secrets:/etc/nginx/secrets:ro

  # Published Edge v0.9.21; Foundry v0.5.7 qualification is pending (docs/compatibility.md).
  # Must equal `edge.image` in docs/compatibility.json;
  # a test fails if it drifts.
  demo-gateway:
    image: ferrumedge/ferrum-edge@sha256:e6b0e4801609ea928b561494c6c5ed518ba97908d6e2dfcb6dd59998eb4f93be
    restart: unless-stopped
    profiles: [demo]
    environment:
      FERRUM_MODE: database
      FERRUM_NAMESPACE: ${FERRUM_NAMESPACE:-ferrum-foundry-demo}
      FERRUM_DB_TYPE: sqlite
      FERRUM_DB_URL: "sqlite:////tmp/ferrum-starter.db?mode=rwc"
      FERRUM_PROXY_BIND_ADDRESS: 0.0.0.0
      FERRUM_ADMIN_BIND_ADDRESS: 0.0.0.0
      # Local-development exception, restricted to this disposable stack.
      FERRUM_ALLOW_INSECURE_ADMIN_HTTP: "true"
      FERRUM_ADMIN_JWT_SECRET: ${FERRUM_JWT_SECRET:?set FERRUM_JWT_SECRET in .env}
      FERRUM_ADMIN_JWT_AUDIENCE: ${FERRUM_JWT_AUDIENCE:-ferrum-admin}
      FERRUM_ADMIN_REQUIRE_NAMESPACE_CLAIM: "true"
      # Demo-only, so not marked required: see the note at the top of the file.
      # `bootstrap-demo.sh` always writes it.
      FERRUM_BASIC_AUTH_HMAC_SECRET: ${FERRUM_BASIC_AUTH_HMAC_SECRET}
    ports:
      # The data plane, so the walkthrough can make a real request through it.
      - "127.0.0.1:${FERRUM_DEMO_PROXY_PORT:-8000}:8000"
      # The admin API, so the preflight can reach it from the host.
      - "127.0.0.1:${FERRUM_DEMO_ADMIN_PORT:-9000}:9000"

  demo-backend:
    image: ${FOUNDRY_IMAGE:-ferrumedge/ferrum-foundry@sha256:1dbe6878b6833bb56805c6de5f5162f1f4970b7a50d71d8921ea2f6bdd46010e}
    restart: unless-stopped
    profiles: [demo]
    # A disposable origin for the proxy created in the walkthrough. The
    # Foundry image has Node itself as its entrypoint, so this needs no extra
    # image and no shell.
    command:
      - "-e"
      - |
        const { createServer } = require("node:http");
        createServer((request, response) => {
          response.writeHead(200, { "content-type": "application/json" });
          response.end(JSON.stringify({
            service: "starter-demo-backend",
            path: request.url,
            saw_api_key: Boolean(request.headers["x-api-key"]),
          }));
        }).listen(8081, "0.0.0.0");
    expose:
      - "8081"
    # The image's own HEALTHCHECK probes the BFF's port, which this service
    # does not run, so it would report unhealthy forever and `up --wait` would
    # never return. Probe what this container actually serves instead, with
    # the Node path the image's own HEALTHCHECK uses (docker/Dockerfile). The
    # Foundry runtime is distroless, with Node only at /nodejs/bin/node.
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - |
          fetch("http://127.0.0.1:8081/health")
            .then((response) => process.exit(response.ok ? 0 : 1))
            .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

# Every service shares one network with a fixed subnet, so oauth2-proxy can
# trust X-Forwarded-* from this range alone (--trusted-proxy-ip above) instead
# of from any peer. 10.73.88.0/24 lies outside Docker's default address pools
# (172.17.0.0/16-172.31.0.0/16 and 192.168.0.0/16) and outside the defaults of
# Podman, kubeadm, k3s, and the major clouds' default networks. If it overlaps
# another Docker network, `up` fails with an overlapping-pool error; if it
# overlaps a network the host reaches (a LAN or a VPN), containers lose their
# route to it. In either case set FOUNDRY_STARTER_SUBNET in .env to a free
# private range. Both profiles use this network; no published port changes.
networks:
  default:
    ipam:
      config:
        - subnet: ${FOUNDRY_STARTER_SUBNET:-10.73.88.0/24}
