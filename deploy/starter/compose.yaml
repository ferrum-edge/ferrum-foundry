# ------------------------------------------------------------------
# Ferrum Foundry starter stack
# ------------------------------------------------------------------
#
#   browser -> proxy (the only published port) -> Foundry BFF -> Ferrum Edge
#
# Two profiles:
#
#   production  the documented topology: nginx terminating TLS, oauth2-proxy
#               owning the OIDC login, your own Ferrum Edge gateway.
#
#   demo        a disposable stack for a first run and for CI. It adds a
#               throwaway gateway and backend and swaps the identity provider
#               for a local stub. The authorization policy, the identity
#               headers, and Foundry itself are the production path.
#
# Compose interpolates the whole file before it filters by profile, so only
# variables BOTH profiles need are marked required (`:?`). A production-only or
# demo-only value that failed to interpolate would stop the other profile from
# starting at all; those are left to the service that reads them, which fails
# with its own message naming what is missing.
#
# Copy .env.example to .env, fill it in, then:
#
#   ./bootstrap-demo.sh            # demo only: generate throwaway secrets
#   docker compose --profile demo up -d
#   node ../../scripts/starter-preflight.mjs
#
# See README.md, and docs/getting-started.md for the first-route walkthrough.

services:
  foundry:
    # `main` is the development channel. For production pin the released
    # Foundry digest named in docs/compatibility.md. The demo and CI override
    # this with the image under test.
    image: ${FOUNDRY_IMAGE:-ferrumedge/ferrum-foundry:main}
    restart: unless-stopped
    profiles: [production, demo]
    # Deliberately no host port: the BFF is reachable only through the proxy.
    expose:
      - "8080"
    environment:
      NODE_ENV: production
      FERRUM_ADMIN_URL: ${FERRUM_ADMIN_URL:?set FERRUM_ADMIN_URL in .env}
      FERRUM_JWT_SECRET: ${FERRUM_JWT_SECRET:?set FERRUM_JWT_SECRET in .env}
      FERRUM_JWT_AUDIENCE: ${FERRUM_JWT_AUDIENCE:-ferrum-admin}
      FERRUM_AUTH_MODE: trusted-proxy
      FERRUM_TRUSTED_PROXY_SECRET: ${FERRUM_TRUSTED_PROXY_SECRET:?set FERRUM_TRUSTED_PROXY_SECRET in .env}
      FERRUM_AUTH_LOGIN_URL: ${FERRUM_AUTH_LOGIN_URL:-/oauth2/start}
      FERRUM_AUTH_LOGOUT_URL: ${FERRUM_AUTH_LOGOUT_URL:-/oauth2/sign_out}
      FERRUM_ENABLE_HSTS: ${FERRUM_ENABLE_HSTS:-true}
      FERRUM_SHUTDOWN_TIMEOUT: "10000"
      # Extra trust anchors for the admin API connection, when the gateway
      # presents a private certificate. Leave unset for a public chain.
      FERRUM_TLS_CA_ROOT: ${FERRUM_TLS_CA_ROOT:-}
      FERRUM_TLS_CA_PATH: ${FERRUM_TLS_CA_PATH:-}
    volumes:
      - ./ca:/etc/ferrum/ca:ro
    # Deliberately no `env_file`: the OAuth client secret never enters the
    # BFF's environment.

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy@sha256:f6a4aa83a27e316114bf79664302b1ffb2cc8ce697fb479273af4feb3fb16fe3 # v7.7.1
    restart: unless-stopped
    profiles: [production]
    expose:
      - "4180"
    # Its own file, not `.env`: `.env` holds FERRUM_JWT_SECRET, which signs
    # gateway admin tokens, and the proxy proof secret. oauth2-proxy needs
    # neither, and an env_file hands a service every variable in it.
    #
    # The issuer, redirect URL, and email domain come from here as
    # OAUTH2_PROXY_* variables rather than through compose interpolation, so a
    # demo run does not have to supply production identity settings. Missing
    # ones are reported by oauth2-proxy itself at startup. `required: false`
    # keeps the demo profile, which never runs this service, from needing the
    # file to exist.
    env_file:
      - path: oauth2-proxy.env
        required: false
    command:
      - --provider=oidc
      - --scope=openid email profile groups
      - --oidc-groups-claim=groups
      # Denies a user who is in none of the Ferrum groups at login, before
      # nginx ever reaches the group-to-role mapping.
      - --allowed-group=ferrum-admins
      - --allowed-group=ferrum-operators
      - --allowed-group=ferrum-viewers
      - --set-xauthrequest=true
      - --reverse-proxy=true
      - --http-address=0.0.0.0:4180

  proxy:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 # 1.27-alpine
    restart: unless-stopped
    profiles: [production]
    depends_on:
      - foundry
      - oauth2-proxy
    ports:
      - "443:443"
    volumes:
      - ./nginx/foundry.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/identity:/etc/nginx/identity:ro
      - ./secrets:/etc/nginx/secrets:ro
      - ./tls:/etc/nginx/tls:ro

  # ---------------- demo profile ----------------

  demo-proxy:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 # 1.27-alpine
    restart: unless-stopped
    profiles: [demo]
    depends_on:
      - foundry
    # Loopback only. The demo identity stub trusts a request header.
    ports:
      - "127.0.0.1:${FOUNDRY_DEMO_PORT:-8088}:8080"
    volumes:
      - ./nginx/foundry.demo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/identity:/etc/nginx/identity:ro
      - ./secrets:/etc/nginx/secrets:ro

  # The Ferrum Edge image CI qualifies (docs/compatibility.md): the published
  # v0.9.5 release. Must equal `edge.image` in docs/compatibility.json; a test
  # fails if it drifts.
  demo-gateway:
    image: ferrumedge/ferrum-edge@sha256:eca46c84bca92d6ef467979f8846537f7ab56c0cdc137befff465526a10fe10f
    restart: unless-stopped
    profiles: [demo]
    environment:
      FERRUM_MODE: database
      FERRUM_NAMESPACE: ${FERRUM_NAMESPACE:-ferrum-foundry-demo}
      FERRUM_DB_TYPE: sqlite
      FERRUM_DB_URL: "sqlite:////tmp/ferrum-starter.db?mode=rwc"
      FERRUM_PROXY_BIND_ADDRESS: 0.0.0.0
      FERRUM_ADMIN_BIND_ADDRESS: 0.0.0.0
      # Local-development exception, restricted to this disposable stack.
      FERRUM_ALLOW_INSECURE_ADMIN_HTTP: "true"
      FERRUM_ADMIN_JWT_SECRET: ${FERRUM_JWT_SECRET:?set FERRUM_JWT_SECRET in .env}
      FERRUM_ADMIN_JWT_AUDIENCE: ${FERRUM_JWT_AUDIENCE:-ferrum-admin}
      FERRUM_ADMIN_REQUIRE_NAMESPACE_CLAIM: "true"
      # Demo-only, so not marked required: see the note at the top of the file.
      # `bootstrap-demo.sh` always writes it.
      FERRUM_BASIC_AUTH_HMAC_SECRET: ${FERRUM_BASIC_AUTH_HMAC_SECRET}
    ports:
      # The data plane, so the walkthrough can make a real request through it.
      - "127.0.0.1:${FERRUM_DEMO_PROXY_PORT:-8000}:8000"
      # The admin API, so the preflight can reach it from the host.
      - "127.0.0.1:${FERRUM_DEMO_ADMIN_PORT:-9000}:9000"

  demo-backend:
    image: ${FOUNDRY_IMAGE:-ferrumedge/ferrum-foundry:main}
    restart: unless-stopped
    profiles: [demo]
    # A disposable origin for the proxy created in the walkthrough. The
    # Foundry image is distroless with Node as its entrypoint, so this needs
    # no extra image and no shell.
    command:
      - "-e"
      - |
        const { createServer } = require("node:http");
        createServer((request, response) => {
          response.writeHead(200, { "content-type": "application/json" });
          response.end(JSON.stringify({
            service: "starter-demo-backend",
            path: request.url,
            saw_api_key: Boolean(request.headers["x-api-key"]),
          }));
        }).listen(8081, "0.0.0.0");
    expose:
      - "8081"
    # The image's own HEALTHCHECK probes the BFF's port, which this service
    # does not run, so it would report unhealthy forever and `up --wait` would
    # never return. Probe what this container actually serves instead.
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - |
          fetch("http://127.0.0.1:8081/health")
            .then((response) => process.exit(response.ok ? 0 : 1))
            .catch(() => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
