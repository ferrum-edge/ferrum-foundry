name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require a safe semantic-version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          metadata="$(node scripts/release-channel-tags.mjs)"
          tag_commit="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tags must point to commits reachable from main" >&2
            exit 1
          fi
          echo "$metadata" >> "$GITHUB_OUTPUT"

  quality-gates:
    name: Pre-publication Gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write

  docker:
    name: Docker (${{ matrix.platform }})
    needs: [quality-gates, release-metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch_dir: amd64
          - platform: linux/arm64
            arch_dir: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: ${{ matrix.arch_dir }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push attested per-platform digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          outputs: type=image,"name=ferrumedge/ferrum-foundry,ghcr.io/${{ github.repository }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.arch_dir }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch_dir }}

      - name: Export digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build returned an invalid image digest" >&2
            exit 1
          fi
          touch "/tmp/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-docker-digest-${{ matrix.arch_dir }}
          path: /tmp/digests/*
          if-no-files-found: error

  docker-manifest:
    name: Docker Manifest
    needs: [docker, release-metadata]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Wait for earlier release runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_WORKFLOW_PATH: .github/workflows/release.yml
        run: |
          set -euo pipefail
          for _attempt in $(seq 1 90); do
            blocking_runs="$(
              {
                for run_status in requested pending queued waiting in_progress; do
                  gh api --paginate --slurp --method GET \
                    "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs" \
                    -f event=push \
                    -f status="$run_status" \
                    -f per_page=100 \
                    || exit 1
                done
              } \
                | jq -s '{
                    total_count: ([.[] | (.[0].total_count // 0)] | add // 0),
                    workflow_runs: [.[][] | .workflow_runs[]]
                  }' \
                | node scripts/release-run-order.mjs
            )"
            if [[ -z "$blocking_runs" ]]; then
              exit 0
            fi
            echo "Waiting for earlier release runs: $blocking_runs"
            sleep 120
          done
          echo "Timed out waiting for earlier release runs" >&2
          exit 1

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: release-docker-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve current release channels
        id: channels
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          git fetch --tags origin
          node scripts/release-channel-tags.mjs >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest (Docker Hub)
        working-directory: /tmp/digests
        env:
          IMAGE_REPOSITORY: ferrumedge/ferrum-foundry
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          RELEASE_MAJOR_MINOR: ${{ needs.release-metadata.outputs.major_minor }}
          ADVANCE_LATEST: ${{ steps.channels.outputs.advance_latest }}
          ADVANCE_MAJOR_MINOR: ${{ steps.channels.outputs.advance_major_minor }}
        run: |
          images=()
          for digest in *; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid digest artifact: $digest" >&2; exit 1; }
            images+=("$IMAGE_REPOSITORY@sha256:${digest}")
          done
          if [[ ${#images[@]} -ne 2 ]]; then
            echo "Expected exactly two platform digests, found ${#images[@]}" >&2
            exit 1
          fi
          source_platforms="$(
            for image in "${images[@]}"; do
              docker buildx imagetools inspect "$image" --raw
            done | jq -sr '[.[] | .manifests[]?.platform | select(.os != "unknown" or .architecture != "unknown") | "\(.os // "missing")/\(.architecture // "missing")"] | sort | join(",")'
          )"
          if [[ "$source_platforms" != "linux/amd64,linux/arm64" ]]; then
            echo "Source digests have unexpected platforms: ${source_platforms:-none}" >&2
            exit 1
          fi
          immutable_tag="$IMAGE_REPOSITORY:$RELEASE_TAG"
          docker buildx imagetools create -t "$immutable_tag" "${images[@]}"
          platforms="$(
            docker buildx imagetools inspect "$immutable_tag" --raw \
              | jq -r '[.manifests[]?.platform | select(.os != "unknown" or .architecture != "unknown") | "\(.os // "missing")/\(.architecture // "missing")"] | sort | join(",")'
          )"
          if [[ "$platforms" != "linux/amd64,linux/arm64" ]]; then
            echo "Published manifest has unexpected platforms: ${platforms:-none}" >&2
            exit 1
          fi
          channel_tags=(-t "$IMAGE_REPOSITORY:$RELEASE_VERSION")
          if [[ "$ADVANCE_MAJOR_MINOR" == "true" ]]; then
            channel_tags+=(-t "$IMAGE_REPOSITORY:$RELEASE_MAJOR_MINOR")
          fi
          if [[ "$ADVANCE_LATEST" == "true" ]]; then
            channel_tags+=(-t "$IMAGE_REPOSITORY:latest")
          fi
          docker buildx imagetools create "${channel_tags[@]}" "$immutable_tag"

      - name: Create and push multi-arch manifest (GHCR)
        working-directory: /tmp/digests
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          RELEASE_MAJOR_MINOR: ${{ needs.release-metadata.outputs.major_minor }}
          ADVANCE_LATEST: ${{ steps.channels.outputs.advance_latest }}
          ADVANCE_MAJOR_MINOR: ${{ steps.channels.outputs.advance_major_minor }}
        run: |
          images=()
          for digest in *; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid digest artifact: $digest" >&2; exit 1; }
            images+=("$IMAGE_REPOSITORY@sha256:${digest}")
          done
          if [[ ${#images[@]} -ne 2 ]]; then
            echo "Expected exactly two platform digests, found ${#images[@]}" >&2
            exit 1
          fi
          source_platforms="$(
            for image in "${images[@]}"; do
              docker buildx imagetools inspect "$image" --raw
            done | jq -sr '[.[] | .manifests[]?.platform | select(.os != "unknown" or .architecture != "unknown") | "\(.os // "missing")/\(.architecture // "missing")"] | sort | join(",")'
          )"
          if [[ "$source_platforms" != "linux/amd64,linux/arm64" ]]; then
            echo "Source digests have unexpected platforms: ${source_platforms:-none}" >&2
            exit 1
          fi
          immutable_tag="$IMAGE_REPOSITORY:$RELEASE_TAG"
          docker buildx imagetools create -t "$immutable_tag" "${images[@]}"
          platforms="$(
            docker buildx imagetools inspect "$immutable_tag" --raw \
              | jq -r '[.manifests[]?.platform | select(.os != "unknown" or .architecture != "unknown") | "\(.os // "missing")/\(.architecture // "missing")"] | sort | join(",")'
          )"
          if [[ "$platforms" != "linux/amd64,linux/arm64" ]]; then
            echo "Published manifest has unexpected platforms: ${platforms:-none}" >&2
            exit 1
          fi
          channel_tags=(-t "$IMAGE_REPOSITORY:$RELEASE_VERSION")
          if [[ "$ADVANCE_MAJOR_MINOR" == "true" ]]; then
            channel_tags+=(-t "$IMAGE_REPOSITORY:$RELEASE_MAJOR_MINOR")
          fi
          if [[ "$ADVANCE_LATEST" == "true" ]]; then
            channel_tags+=(-t "$IMAGE_REPOSITORY:latest")
          fi
          docker buildx imagetools create "${channel_tags[@]}" "$immutable_tag"

  create-release:
    name: Create GitHub Release
    needs: [docker-manifest, release-metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve current release channels
        id: channels
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          git fetch --tags origin
          node scripts/release-channel-tags.mjs >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          STABLE_RELEASE: ${{ needs.release-metadata.outputs.stable }}
          ADVANCE_LATEST: ${{ steps.channels.outputs.advance_latest }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          ghcr = os.environ["IMAGE_REPOSITORY"]
          repository = os.environ["SOURCE_REPOSITORY"]
          notes = f"""## Ferrum Foundry {tag}

          ### Docker

          ```bash
          docker pull ferrumedge/ferrum-foundry:{tag}
          docker pull {ghcr}:{tag}
          ```

          ### Production quick start

          Run Foundry only behind an identity-aware reverse proxy that removes
          client-supplied identity headers and injects the trusted proxy proof:

          ```bash
          export FERRUM_JWT_SECRET=$(openssl rand -hex 32)
          export FERRUM_TRUSTED_PROXY_SECRET=$(openssl rand -hex 32)

          docker run \\
            -e FERRUM_ADMIN_URL=https://your-gateway:9443 \\
            -e FERRUM_JWT_SECRET \\
            -e FERRUM_AUTH_MODE=trusted-proxy \\
            -e FERRUM_TRUSTED_PROXY_SECRET \\
            -p 127.0.0.1:8080:8080 \\
            ferrumedge/ferrum-foundry:{tag}
          ```

          Configure the proxy to send `X-Ferrum-Auth-Secret`,
          `X-Forwarded-User`, `X-Ferrum-Role`, and exact
          `X-Ferrum-Namespaces` grants. See
          [Production authentication](https://github.com/{repository}/blob/{tag}/docs/authentication.md).
          """
          Path("notes.md").write_text(notes, encoding="utf-8")
          PY

          release_args=(
            --title "Ferrum Foundry $RELEASE_TAG"
            --notes-file notes.md
            --verify-tag
          )
          if [[ "$STABLE_RELEASE" != "true" ]]; then
            release_args+=(--prerelease --latest=false)
          elif [[ "$ADVANCE_LATEST" == "true" ]]; then
            release_args+=(--latest)
          else
            release_args+=(--latest=false)
          fi
          gh release create "$RELEASE_TAG" "${release_args[@]}"
