name: Prune Stale PR Branches

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      delete_live:
        description: 'Delete candidates after the protected-environment approval'
        required: true
        default: false
        type: boolean
      confirm_repository:
        description: 'For live deletion, enter ferrum-edge/ferrum-foundry'
        required: false
        type: string
      days_stale:
        description: 'Minimum age for closed, unmerged PRs (1-3650 days)'
        required: true
        default: '30'
        type: string

concurrency:
  group: prune-stale-pr-branches
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    name: Dry-run branch plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test branch-selection safety rules
        run: node --test scripts/prune-pr-branches.test.mjs

      - name: List candidates without deleting
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_DAYS: ${{ inputs.days_stale || '30' }}
        run: >-
          node scripts/prune-pr-branches.mjs
          --dry-run
          --stale-days "$STALE_DAYS"

  delete:
    name: Approved live branch deletion
    if: github.event_name == 'workflow_dispatch' && inputs.delete_live
    needs: plan
    runs-on: ubuntu-latest
    environment: branch-pruning
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Re-fetch, re-verify, and delete exact branch refs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIRM_REPOSITORY: ${{ inputs.confirm_repository }}
          STALE_DAYS: ${{ inputs.days_stale }}
        run: >-
          node scripts/prune-pr-branches.mjs
          --delete
          --confirm-repository "$CONFIRM_REPOSITORY"
          --stale-days "$STALE_DAYS"
