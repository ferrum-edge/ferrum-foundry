version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Weekly minor and patch bumps arrive as one pull request; majors stay
      # separate so a breaking upgrade is reviewed on its own.
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/node tracks the Node.js major the image runs (docker/Dockerfile);
      # its major moves by hand together with the runtime, never on its own.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # @tanstack/react-table 9 is a different API (useTable, tableFeatures,
      # createCoreRowModel) rather than a drop-in major. Migrate DataTable.tsx
      # deliberately, then remove this entry.
      - dependency-name: "@tanstack/react-table"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      # The builder's Node major is deliberately coupled to the runtime major
      # in docker/Dockerfile (gcr.io/distroless/nodejs<major>-debian13): a major
      # bump here alone would build against one Node and run on another. Move
      # the pair by hand, and only once the matching distroless nodejs image
      # exists.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"

  # The deployment starter and the critical-journey overlay pin third-party
  # images as `name:tag@sha256:<digest>`; Dependabot reads the tag and moves
  # both together. Ferrum's own images are pinned by digest alone and move
  # only with the pairing record (docs/compatibility.json), never here.
  - package-ecosystem: "docker-compose"
    directory: "/deploy/starter"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "ferrumedge/ferrum-edge"
      - dependency-name: "ferrumedge/ferrum-foundry"

  - package-ecosystem: "docker-compose"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "ferrumedge/ferrum-edge"
      - dependency-name: "ferrumedge/ferrum-foundry"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
