version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Weekly minor and patch bumps arrive as one pull request; majors stay
      # separate so a breaking upgrade is reviewed on its own.
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/node tracks the Node.js major the image runs (docker/Dockerfile);
      # its major moves by hand together with the runtime, never on its own.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      # The builder's Node major is deliberately coupled to the distroless
      # runtime major in docker/Dockerfile: a major bump here alone would build
      # against one Node and run on another. The pair is moved by hand once
      # the matching distroless nodejs image exists.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
